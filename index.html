<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/monix-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Monix — Homebanking</title>
  </head>
  <body>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('monix-theme') || '{}')
        if (s.state && s.state.theme === 'dark') document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
