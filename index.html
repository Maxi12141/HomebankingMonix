    <link rel="icon" type="image/svg+xml" href="/monix-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <meta property="og:title" content="Monix — Tu banco entero, en el celular" />

  <body>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('monix-theme') || '{}')
        if (s.state && s.state.theme === 'dark') document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
